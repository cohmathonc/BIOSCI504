on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  package-development:
    runs-on: ubuntu-latest
    name: ubuntu-latest (format and documentation)

    steps:
      - uses: actions/checkout@v6

      - uses: posit-dev/setup-air@v1
        with:
          version: "0.9.0"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: cran::roxygen2@7.3.3
          needs: check

      - name: Check formatting and documentation
        run: tools/check-development.sh

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  template-render:
    runs-on: ubuntu-latest
    name: ubuntu-latest (R release, Quarto render)

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install BIOSCI504
        run: R CMD INSTALL .

      - name: Copy exercise templates
        shell: Rscript {0}
        run: |
          project <- file.path(
            Sys.getenv("RUNNER_TEMP"),
            "BIOSCI504-course-project"
          )
          BIOSCI504::create_course_project(project)
          templates <- BIOSCI504::course_resources() |>
            dplyr::filter(.data$type == "template") |>
            dplyr::pull(.data$resource)
          purrr::walk(templates, function(template) {
            BIOSCI504::copy_template(
              template,
              dest = file.path(project, "exercises", template)
            )
          })

      - name: Render exercise templates
        working-directory: ${{ runner.temp }}/BIOSCI504-course-project
        run: quarto render exercises
