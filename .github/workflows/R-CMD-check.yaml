on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  template-render:
    runs-on: ubuntu-latest
    name: ubuntu-latest (R release, Quarto render)

    env:
      COURSE_PROJECT: ${{ runner.temp }}/BIOSCI504-course-project

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install BIOSCI504
        run: R CMD INSTALL .

      - name: Copy exercise template
        shell: Rscript {0}
        run: |
          project <- Sys.getenv("COURSE_PROJECT")
          BIOSCI504::create_course_project(project)
          BIOSCI504::copy_template(
            "tabular-comparison",
            dest = file.path(project, "exercises", "tabular-comparison")
          )

      - name: Render exercise template
        working-directory: ${{ env.COURSE_PROJECT }}
        run: quarto render exercises/tabular-comparison/analysis.qmd
